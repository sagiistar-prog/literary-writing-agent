name: Offline quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-plugin.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/plugin_run.py --input examples/plugin-input.json
      - run: python scripts/build_review_examples.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writing-review-evidence
          path: output/browser-check
  portfolio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/portfolio_audit.ps1
        env:
          GH_TOKEN: ${{ github.token }}
